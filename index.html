<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplitWise Lite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>SplitWise Lite</h1>
        <p>Track group expenses and see who owes whom instantly.</p>
      </header>

      <section class="card">
        <h2>Add Member</h2>
        <form id="member-form" class="row">
          <input id="member-name" type="text" placeholder="e.g. Alex" required maxlength="30" />
          <button type="submit">Add</button>
        </form>
        <ul id="member-list" class="chip-list"></ul>
      </section>

      <section class="card">
        <h2>Add Expense</h2>
        <form id="expense-form">
          <div class="row">
            <input id="expense-title" type="text" placeholder="Dinner" required maxlength="50" />
            <input id="expense-amount" type="number" step="0.01" min="0.01" placeholder="Amount" required />
          </div>

          <div class="row">
            <label for="paid-by">Paid by</label>
            <select id="paid-by" required></select>
          </div>

          <fieldset>
            <legend>Split between</legend>
            <div id="participants" class="participant-grid"></div>
          </fieldset>

          <button type="submit">Add Expense</button>
        </form>
      </section>

      <section class="card">
        <h2>Expenses</h2>
        <ul id="expense-list" class="expense-list"></ul>
      </section>

      <section class="card">
        <h2>Balances</h2>
        <ul id="balance-list" class="balance-list"></ul>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
